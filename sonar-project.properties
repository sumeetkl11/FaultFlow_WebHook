# ── SonarQube / SonarCloud Configuration for FaultFlow ──────────────────────────
sonar.projectKey=FaultFlow_WebHook
sonar.projectName=FaultFlow - Resilient Webhook Engine
sonar.projectVersion=1.0.0

# Encoding & Source paths
sonar.sourceEncoding=UTF-8
sonar.sources=server/src,client/src
sonar.tests=server/tests

# TypeScript Configurations
sonar.typescript.tsconfigPaths=server/tsconfig.json,client/tsconfig.json

# File Exclusions (omit generated bundles, binary dumps, and third-party modules)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/coverage/**,\
  **/*.bat,\
  **/*.sh,\
  **/*.ps1,\
  **/*.rdb,\
  **/*.sql,\
  **/package-lock.json

# Test Inclusions & Coverage
sonar.test.inclusions=server/tests/**/*.ts,**/*.test.ts,**/*.spec.ts
sonar.javascript.environments=node,browser
